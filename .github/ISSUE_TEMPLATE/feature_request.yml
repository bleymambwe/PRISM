name: Feature request
description: Propose a research-motivated improvement
title: "[Feature]: "
labels: [enhancement]
body:
  - type: textarea
    id: need
    attributes:
      label: Research need
      description: Which permutation-valued decision cannot be handled cleanly today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Include alternatives, trade-offs, and expected failure modes.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Validation evidence
      description: Suggest a deterministic test or openly reproducible benchmark.
    validations:
      required: true

